aid: pax8
name: Pax8
description: 'Pax8 is a cloud commerce marketplace that lets managed service providers (MSPs), managed
  IT providers, and software vendors discover, buy, sell, provision, and manage cloud software and
  subscriptions for small and midsize businesses. The Pax8 Public API automates the full commerce
  lifecycle: creating and managing partner companies and contacts, browsing the product catalog,
  placing and updating orders, managing subscription lifecycle changes, billing and invoice
  reconciliation, quoting (CPQ), vendor provisioning and usage reporting, and event-driven webhooks.
  APIs authenticate with OAuth2 client-credentials over api.pax8.com, and an official hosted MCP
  server exposes the marketplace to AI agents. Pax8 connects 47,000+ partners with hundreds of
  vendors serving 800,000+ SMBs. Backed by SoftBank Vision Fund.'
