components:
  schemas:
    Webhook:
      type: object
      required:
      - id
      - accountId
      - displayName
      - active
      - errorThreshold
      - webhookTopics
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the webhook
          readOnly: true
        accountId:
          type: string
          format: uuid
          description: Account ID that owns this webhook
        displayName:
          type: string
          description: Display name for the webhook
        url:
          type: string
          description: URL where webhook events will be sent
        authorization:
          type: string
          description: Authorization header value for webhook
        active:
          type: boolean
          description: Whether the webhook is active
        contactEmail:
          type: string
          description: Email address to notify when webhook delivery errors occur
        errorThreshold:
          type: integer
          format: int32
          description: Number of times a webhook will be retried and consecutive errors will result in an email notification
        integrationId:
          type: string
          format: uuid
          description: Id of the integration this webhook is associated with, if applicable
        webhookTopics:
          type: array
          items:
            $ref: '#/components/schemas/WebhookTopic'
          description: List of topics and configurations this webhook subscribes to
        lastDeliveryStatus:
          allOf:
          - $ref: '#/components/schemas/WebhookDeliveryStatus'
          description: Last delivery status of the webhook
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the webhook was created
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the webhook was last updated
          readOnly: true
      description: Webhook subscription information
    ReplaceWebhookTopics:
      type: object
      required:
      - webhookTopics
      properties:
        webhookTopics:
          type: array
          items:
            $ref: '#/components/schemas/AddWebhookTopic'
          description: List of webhook topics to replace existing ones
      description: Command for replacing webhook topics
    ErrorType:
      type: string
      enum:
      - NOT_FOUND
      - UNAUTHORIZED
      - FORBIDDEN
      - BAD_REQUEST
      - INTERNAL_SERVER_ERROR
      - INVALID_PARAM
      description: The type of error that occurred
    WebhookPagedResult:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
          description: List of webhooks
        page:
          allOf:
          - $ref: '#/components/schemas/Page'
          description: Page information
      description: Paged response for webhooks
    Page:
      type: object
      required:
      - number
      - size
      - totalElements
      - totalPages
      properties:
        number:
          type: integer
          format: int32
          default: 0
        size:
          type: integer
          format: int32
          default: 0
        totalElements:
          type: integer
          format: int64
          default: 0
        totalPages:
          type: integer
          format: int32
          default: 0
    WebhookDeliveryStatus:
      type: string
      enum:
      - PENDING
      - SUCCESS
      - FAILED
      - RETRYING
      description: Status of webhook delivery
    WebhookTest:
      type: object
      required:
      - url
      - webhook
      properties:
        url:
          type: string
          description: URL that was called
        webhook:
          allOf:
          - $ref: '#/components/schemas/Webhook'
          description: Full webhook configuration that was tested
        samplePayload:
          type: object
          additionalProperties: {}
          description: Sample payload that was sent
      description: Response from testing a webhook
    WebhookTopic:
      type: object
      required:
      - id
      - topic
      - filters
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the webhook topic
        topic:
          type: string
          description: The topic name
        filters:
          type: array
          items:
            $ref: '#/components/schemas/WebhookFilter'
          description: Advanced filtering configuration
      description: Topic configuration for a webhook subscription
    AddWebhookTopic:
      type: object
      required:
      - topic
      - filters
      properties:
        topic:
          type: string
          description: The topic name to subscribe to
        filters:
          type: array
          items:
            $ref: '#/components/schemas/UpdateWebhookFilter'
          description: Advanced filtering configuration
      description: Command for webhook topic configuration
    FilterOperator:
      type: string
      enum:
      - EQUALS
      - NOT_EQUALS
      - GREATER_THAN
      - LESS_THAN
      - IN
      - NOT_IN
      - CONTAINS
