    UpdateFilterCondition:
      type: object
      required:
      - field
      - operator
      - value
      properties:
        field:
          type: string
          description: Field path to filter on
        operator:
          allOf:
          - $ref: '#/components/schemas/FilterOperator'
          description: Operator to use for comparison
        value:
          type: array
          items:
            type: string
          description: Values to compare against
      description: Command for filter condition
    CreateWebhook:
      type: object
      required:
      - displayName
      properties:
