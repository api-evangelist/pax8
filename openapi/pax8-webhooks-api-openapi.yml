    UpdateWebhookTopicConfiguration:
      type: object
      required:
      - filters
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/UpdateWebhookFilter'
          description: Advanced filtering configuration
      description: Command for updating webhook topic configuration
    WebhookFilter:
      type: object
      required:
      - action
      - conditions
      properties:
        action:
          type: string
          description: Action to filter on
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/FilterCondition'
          description: List of conditions that must all be true
      description: Filter configuration for webhook actions
    FilterCondition:
      type: object
      required:
      - field
      - operator
      - value
      properties:
        field:
          type: string
