components:
  schemas:
    WebhookLog:
      type: object
      required:
      - id
      - webhookId
      - webhookName
      - finalStatus
      - callHistory
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the log entry
          readOnly: true
        webhookId:
          type: string
          format: uuid
          description: ID of the webhook this log belongs to
        webhookName:
          type: string
          description: Display name of the webhook
        finalStatus:
          allOf:
          - $ref: '#/components/schemas/WebhookDeliveryStatus'
          description: Final status of the webhook delivery
        callHistory:
          type: array
          items:
            $ref: '#/components/schemas/WebhookCall'
          description: History of delivery attempts
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the log was created
          readOnly: true
      description: Webhook log information
    ErrorType:
      type: string
      enum:
      - NOT_FOUND
      - UNAUTHORIZED
      - FORBIDDEN
      - BAD_REQUEST
      - INTERNAL_SERVER_ERROR
      - INVALID_PARAM
      description: The type of error that occurred
    WebhookDeliveryStatus:
      type: string
      enum:
      - PENDING
      - SUCCESS
      - FAILED
      - RETRYING
      description: Status of webhook delivery
    WebhookLogPagedResult:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/WebhookLog'
          description: List of webhook logs
        page:
          allOf:
          - $ref: '#/components/schemas/Page'
          description: Page information
      description: Paged response for webhook logs
    Page:
      type: object
      required:
      - number
      - size
      - totalElements
      - totalPages
      properties:
        number:
          type: integer
          format: int32
          default: 0
        size:
          type: integer
          format: int32
          default: 0
        totalElements:
          type: integer
          format: int64
          default: 0
        totalPages:
          type: integer
          format: int32
          default: 0
    WebhookCall:
      type: object
      required:
      - id
      - timestamp
      - status
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the call attempt
          readOnly: true
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the call attempt
        status:
          allOf:
          - $ref: '#/components/schemas/WebhookDeliveryStatus'
          description: Status of the call attempt
        errorMessage:
          type: string
          description: Error message if the call failed
        httpStatusCode:
          type: integer
          format: int32
          description: HTTP status code returned by the webhook endpoint
        payload:
          type: object
          additionalProperties: {}
          description: The payload that was sent in the webhook
      description: Individual webhook call attempt
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://token-manager.pax8.com/oauth/token
          scopes: {}
